# Launch the YOLOv8 ROS node alongside a rosbag, RViz2, and a detections topic echo.
# Run from the workspace root: `tmuxp load tmuxp_configs/rviz_yolov8.yaml`.
session_name: yolov8
start_directory: ../
windows:
  - window_name: yolov8
    layout: tiled
    panes:
      - shell_command:
          - source /opt/ros/iron/setup.bash
          - source install/setup.bash
          - ros2 launch yolov8 yolov8.launch.py
      - shell_command:
          - source /opt/ros/iron/setup.bash
          - source install/setup.bash
          # Replace this path with a rosbag containing your CAMERA_TOPICS.
          - ros2 bag play -l ../yolov8_ros_bags/overtaken_right
      - shell_command:
          - source /opt/ros/iron/setup.bash
          - source install/setup.bash
          - ros2 launch yolov8 rviz2_yolov8.launch.py
      - shell_command:
          - source /opt/ros/iron/setup.bash
          - source install/setup.bash
          # Wait briefly so the node is publishing before we attach.
          - sleep 5
          # Replace with one of the /yolov8/<camera>/detections topics from your CAMERA_TOPICS.
          - ros2 topic echo /yolov8/vimba_front/detections
